<!DOCTYPE html>
<html lang="en-gb">
<head>
	<meta charset="UTF-8">
	<title>OpenTimeline Which Date HTML Game Test</title>
</head>
<body>
	<h2>Which Date HTML Game</h2>

	<p>Status: <span status>None</span></p>

	<label>
		<input type="radio" name="start-end" start checked>
		Start date
	</label>
	<label>
		<input type="radio" name="start-end" end>
		End date
	</label>

	<label>
		<input type="radio" name="year-decade" year checked>
		Year
	</label>
	<label>
		<input type="radio" name="year-decade" decade>
		Decade
	</label>

	<p>Description: <span description>None</span></p>

	<div game-time hidden>
		<p>Stats: Round = <span round>0</span> Correct = <span correct>0</span> Incorrect = <span incorrect>0</span></p>

		<p>Question: <span question>None</span></p>
		<label>
			Answer
			<input answer type="number" min="-50000" max="50000" step="1" value="0">
		</label>

		<button type="button" submit>Submit</button>
		<button type="button" next-round disabled>Next Round</button>
		<button type="button" end-game style="display: block;" disabled>End Game</button>
	</div>

	<button type="button" new-game style="display: block;">New Game</button>
</body>
</html>

<script type="module">
	import * as load from "./../other/load.js";
	import init, * as OpenTimelineGames from "/wasm/games/pkg/open_timeline_games.js";
	await init();

	// Run
	let game = new OpenTimelineGames.WasmWhichDateGame();
	console.log(game);
	game.set_entity_pool(await load.get_entities())

	//--------------------------------------------------------------------------
	// Get elements
	//--------------------------------------------------------------------------
	// Buttons
	const next_round_button = document.querySelector("button[next-round]")
	const submit_button = document.querySelector("button[submit]")
	const new_game_button = document.querySelector("button[new-game]")
	const end_game_button = document.querySelector("button[end-game]")

	// Answer
	const answer_input = document.querySelector("input[answer]")

	// Variants
	const game_variant_input_start = document.querySelector("input[start]")
	const game_variant_input_end = document.querySelector("input[end]")
	const game_variant_input_year = document.querySelector("input[year]")
	const game_variant_input_decade = document.querySelector("input[decade]")

	//--------------------------------------------------------------------------
	// Event listeners
	//--------------------------------------------------------------------------
	next_round_button.addEventListener('click', event => {
		game.next_round()
	});

	submit_button.addEventListener('click', event => {
		game.check_answer(answer_input.value)
	});

	game_variant_input_start.addEventListener("click", event => {
		const variant = OpenTimelineGames.WhichDateGameVariant.StartDate
		game.set_variant(variant)
	})

	game_variant_input_end.addEventListener("click", event => {
		const variant = OpenTimelineGames.WhichDateGameVariant.EndDate
		game.set_variant(variant)
	})

	game_variant_input_year.addEventListener("click", event => {
		const variant = OpenTimelineGames.YearOrDecade.Year
		game.set_year_or_decade(variant)
	})

	game_variant_input_decade.addEventListener("click", event => {
		const variant = OpenTimelineGames.YearOrDecade.Decade
		game.set_year_or_decade(variant)
	})

	new_game_button.addEventListener("click", event => {
		game.new_game()
	})

	end_game_button.addEventListener("click", event => {
		game.end_game()
	})
</script>
